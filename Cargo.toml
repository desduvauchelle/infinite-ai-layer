[workspace]
members = [
  "rust/infinite-ai-core",
  "rust/infinite-ai-conformance",
  "rust/infinite-ai-providers",
  "rust/infinite-ai-agents",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
futures-core = "0.3.31"
futures-util = "0.3.31"
jsonschema = { version = "0.52.0", default-features = false }
nix = { version = "0.30.1", features = ["process", "signal"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rust_decimal = { version = "1.37.2", features = ["serde-with-str"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
wiremock = "0.6.5"
